<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Named reaction quizzes, a searchable reaction library, and practice statistics.">
  <title>Named Reaction Database</title>
  <link rel="stylesheet" href="assets/styles.css?v=20261010-solid-chevrons">
  <script src="assets/reactions.js" defer></script>
  <script src="assets/book-data.js" defer></script>
  <script src="assets/book-sections.js" defer></script>
  <script src="assets/flashcard-figures.js?v=20261010-books-final" defer></script>
  <script src="assets/li-data.js?v=20261010-books-final" defer></script>
  <script src="assets/app.js?v=20261010-solid-chevrons" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="#dashboard" class="brand">Name Reaction Database</a>
    <nav aria-label="Main navigation">
      <a href="#dashboard" data-page="dashboard" class="nav-item active">Home</a>
      <a href="#library" data-page="library" class="nav-item">Reactions</a>
      <a href="#practice" data-page="practice" class="nav-item">Practice</a>
      <a href="#flashcards" data-page="flashcards" class="nav-item">Flashcards</a>
      <a href="#statistics" data-page="statistics" class="nav-item">Statistics</a>
      <a href="#saved" data-page="saved" class="nav-item">Saved</a>
    </nav>
  </header>
  <div class="content-layout">
    <aside class="category-sidebar" aria-label="Book and category selection">
      <label class="book-filter" for="book-filter">Book<select id="book-filter"></select></label>
      <p class="sidebar-note">Shared reactions appear under both books.</p>
      <details open>
        <summary>Categories</summary>
        <p class="sidebar-note">Filter reactions, quizzes, and flashcards.</p>
        <fieldset id="category-options"><legend class="visually-hidden">Select reaction categories</legend></fieldset>
        <p id="selection-count" class="sidebar-note" aria-live="polite"></p>
      </details>
    </aside>
    <main id="main-content"></main>
  </div>
  <footer><span>Name Reaction Database / Organic chemistry</span><span class="local-status">Progress saved in this browser.</span></footer>
<dialog id="quiz-dialog" aria-labelledby="quiz-title"></dialog>
<dialog id="reaction-dialog" aria-labelledby="reaction-title"></dialog>
<dialog id="flashcard-dialog" aria-labelledby="flashcard-title"></dialog>
<div id="toast" role="status"></div>
</body>
</html>
